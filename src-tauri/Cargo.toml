[package]
name = "tauri-linux-terminal"
version = "0.1.0"
description = "Terminal Linux Haute Performance avec Rust & Tauri"
authors = ["AI Studio Developer <dev@aistudio.build>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8"
lazy_static = "1.4"
num_cpus = "1.16"
log = "0.4"
env_logger = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
